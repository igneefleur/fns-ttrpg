<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plateau de Narration</title>
  <!-- AMORCEUR GELÉ, pour la même raison que roll20-fiche.html : le panneau
       signé charge cette page en dur, SANS query, et GitHub Pages la sert avec
       dix minutes de cache. Rien ne doit donc être nommé ici — ni script, ni
       feuille de style, ni version. La page lit le manifeste, qui se relit sans
       cache, et charge ce qu'il nomme. Le repli DEFAUT n'existe que pour le
       jour où le manifeste manquerait. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <!-- Un mot pendant le chargement, et surtout : un mot qui RESTE si le
       manifeste nomme un fichier absent. L'amorceur avale les erreurs de
       chargement pour ne jamais geler, un panneau muet serait sinon la seule
       trace de la panne. -->
  <div id="nb"><p id="nb-attente">Chargement du plateau…<noscript> Le plateau a besoin de JavaScript.</noscript></p></div>
  <script>
  // JOUR / NUIT avant le premier rendu, exactement comme la fiche, et pour la
  // même raison : ces quelques lignes doivent rester ICI, dans l'amorceur. Le
  // thème est une CLASSE sur <html> ; posée plus tard, après la lecture du
  // manifeste, le plateau clignoterait en clair avant de basculer en sombre.
  // La règle est celle de la fiche, dans le même ordre : le choix mémorisé de
  // ce joueur, puis l'indice n=1/0 du hash (posé par la coquille d'après le
  // réglage miaNuit de l'extension, et absent quand il vaut « auto »), puis le
  // thème du navigateur. mia-narration.js la rejoue et l'expose dans ses
  // réglages ; la clé lui est propre, celle de la fiche est « mia-r20-night »
  // et les deux pages viennent de la même origine.
  (function () {
    "use strict";
    try {
      var h = location.hash || "";
      var p = null;
      try { p = localStorage.getItem("mia-r20-night-plateau"); } catch (e) {}
      var on = p === "1" ? true : p === "0" ? false
             : /[#&]n=1/.test(h) ? true : /[#&]n=0/.test(h) ? false
             : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("night", on);
    } catch (e) {}
  })();
  (function () {
    "use strict";
    var DEFAUT = {
      js: ["javascripts/mia-narration.js"],
      css: ["stylesheets/mia-narration.css"]
    };
    var DELAI = 3000;

    function sure(u) {
      return typeof u === "string" && u &&
             !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) && u.indexOf("//") !== 0 &&
             u.indexOf("..") < 0;
    }
    function listeSure(l) { return Array.isArray(l) && l.length && l.every(sure); }

    function css(u) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = u;
      document.head.appendChild(l);
    }
    function serie(urls) {
      var i = 0;
      (function suivant() {
        if (i >= urls.length) return;
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = suivant;
        s.onerror = suivant;
        document.body.appendChild(s);
      })();
    }

    var parti = false;
    function une(m) {
      if (parti) return;
      parti = true;
      var n = m && m.narration;
      if (!n || !listeSure(n.js) || !listeSure(n.css)) n = DEFAUT;
      n.css.forEach(css);
      serie(n.js);
    }

    setTimeout(function () { une(null); }, DELAI);
    try {
      fetch("mia-manifeste.json?t=" + new Date().getTime(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(une, function () { une(null); });
    } catch (e) { une(null); }
  })();
  </script>
</body>
</html>
