# Configuration de CI : hérite de mkdocs.yml. Utilisée par la CI Linux
# (.github/workflows/deploy.yml).
#
# LE PDF EST DÉSACTIVÉ TANT QU'IL N'Y A PAS DE LIVRE. Les branches HxH génèrent
# un PDF via mkdocs-to-pdf (moteur WeasyPrint) ; ici il n'y a qu'une poignée de
# pages, et faire paginer un livre vide ferait échouer le build — donc plus rien
# ne se déploierait. Le jour où les règles existent, rétablir :
#
#   plugins:
#     - search
#     - to-pdf:
#         enabled_if_env: ENABLE_PDF_EXPORT
#         output_path: pdf/livre-de-regles.pdf
#         cover_title: Outward Système JDR
#         cover_subtitle: Livre de Règles
#         author: igneefleur
#         toc_title: Table des matières
#
# ...et remettre dans deploy.yml les dépendances natives de WeasyPrint (Pango,
# HarfBuzz, fontconfig), la variable ENABLE_PDF_EXPORT=1, ainsi que le script
# docs/javascripts/print-book.js qui affiche le bouton de téléchargement.
INHERIT: mkdocs.yml
