<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Boutique Outward sur Roll20</title>
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <div id="ob-shell">
    <header class="ob-entete">
      <h1>Boutique</h1>
      <div id="ob-status" role="status" aria-live="polite">Chargement des équipements…</div>
    </header>
    <div class="ob-main">
      <aside class="ob-filtres" aria-label="Recherche et filtres">
          <label for="ob-recherche">Recherche
            <input id="ob-recherche" type="search" placeholder="Nom de l'équipement" autocomplete="off" disabled>
          </label>
          <label for="ob-categorie">Catégorie
            <select id="ob-categorie" disabled><option value="">Toutes les catégories</option></select>
          </label>
          <label for="ob-sous-categorie">Sous-catégorie
            <select id="ob-sous-categorie" disabled><option value="">Toutes les sous-catégories</option></select>
          </label>
          <fieldset><legend>Prix d’achat (argent)</legend><div class="ob-plage"><label>Minimum<input id="ob-prix-min" type="number" min="0" step="any"></label><label>Maximum<input id="ob-prix-max" type="number" min="0" step="any"></label></div><label class="ob-check"><input id="ob-prix-inconnu" type="checkbox"> Inclure les prix non renseignés</label></fieldset>
          <label>Effet <input id="ob-effet" type="search" placeholder="Nom de l’effet"></label>
          <label>Caractéristique <select id="ob-caracteristique"><option value="">Toutes</option><option value="froid">Protection contre le froid</option><option value="chaud">Protection contre la chaleur</option><option value="prot_physique">Protection physique</option><option value="res_physique">Résistance physique</option><option value="res_feu">Résistance au feu</option><option value="res_froid">Résistance au froid</option><option value="res_eclair">Résistance à l’éclair</option><option value="res_decomposition">Résistance à la décomposition</option><option value="res_ethere">Résistance à l’éthéré</option><option value="vitesse">Vitesse</option><option value="barriere">Barrière</option><option value="recuperationAction">Récupération d’action</option><option value="pm">Réduction du coût en PM</option><option value="pe">Réduction du coût en PE</option><option value="poches">Poches</option></select></label>
          <label>Valeur minimale <input id="ob-carac-min" type="number" step="any" value="1"></label>
          <div class="ob-plage"><label>Poids max. (kg)<input id="ob-poids-max" type="number" min="0" step="any"></label><label>Volume max. (L)<input id="ob-volume-max" type="number" min="0" step="any"></label></div>
          <label>Taille <select id="ob-taille"><option value="">Toutes</option><option>Microscopique</option><option>Infime</option><option>Minuscule</option><option>Très petite</option><option>Petite</option><option>Moyenne</option><option>Grande</option><option>Très grande</option><option>Gigantesque</option><option>Colossale</option></select></label>
          <label>Trier par <select id="ob-tri"><option value="nom">Nom</option><option value="achat">Prix</option><option value="poids">Poids</option><option value="volume">Volume</option></select></label>
          <label class="ob-check"><input id="ob-inverse" type="checkbox"> Ordre décroissant</label>
          <button id="ob-reset" type="button">Effacer les filtres</button>
      </aside>
      <section class="ob-col-catalogue" aria-label="Catalogue des équipements">
        <div id="ob-items" class="ob-items" aria-label="Équipements"></div>
        <footer class="ob-pagination">
          <button id="ob-precedent" type="button" disabled>Précédent</button>
          <span id="ob-page" aria-live="polite">—</span>
          <button id="ob-suivant" type="button" disabled>Suivant</button>
        </footer>
      </section>
      <aside class="ob-col-details" aria-label="Détails de l'équipement"><div id="ob-details"></div></aside>
    </div>
  </div>
  <dialog id="ob-dialog" aria-labelledby="ob-dialog-title">
    <form method="dialog">
      <h2 id="ob-dialog-title">Quantité</h2>
      <label for="ob-quantite-chat">Quantité à envoyer
        <input id="ob-quantite-chat" type="number" min="1" step="1" value="1" required>
      </label>
      <div class="ob-dialog-actions">
        <button id="ob-annuler" type="button">Annuler</button>
        <button type="submit">Confirmer</button>
      </div>
    </form>
  </dialog>
  <script>
    (function () {
      'use strict';
      var repli={js:['javascripts/owd-boutique.js'],css:['stylesheets/owd-boutique.css']};
      var lance=false;
      function sure(u){return typeof u==='string'&&!!u&&!/^[A-Za-z][A-Za-z0-9+.-]*:/.test(u)&&u.indexOf('//')!==0&&u.indexOf('..')<0;}
      function valide(m){var c=m&&m.boutique;return c&&Array.isArray(c.js)&&c.js.length&&c.js.every(sure)&&Array.isArray(c.css)&&c.css.length&&c.css.every(sure);}
      function demarre(man){if(lance)return;lance=true;var c=valide(man)?man.boutique:repli;
        c.css.forEach(function(u){var link=document.createElement('link');link.rel='stylesheet';link.href=u;document.head.appendChild(link);});
        (function suivants(i){if(i>=c.js.length)return;var script=document.createElement('script');script.src=c.js[i];script.onload=script.onerror=function(){suivants(i+1);};document.body.appendChild(script);})(0);
      }
      setTimeout(function(){demarre(null);},3000);
      try{fetch('owd-manifeste.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(demarre,function(){demarre(null);});}catch(e){demarre(null);}
    })();
  </script>
  <noscript>La boutique nécessite JavaScript.</noscript>
</body>
</html>
