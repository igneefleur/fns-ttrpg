<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plateau de Narration</title>
  <!-- AMORCEUR GELÉ, pour la même raison que roll20-fiche.html : le panneau
       signé charge cette page en dur, SANS query, et GitHub Pages la sert avec
       dix minutes de cache. Rien ne doit donc être nommé ici — ni script, ni
       feuille de style, ni version. La page lit le manifeste, qui se relit sans
       cache, et charge ce qu'il nomme. Le repli DEFAUT n'existe que pour le
       jour où le manifeste manquerait. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <!-- Un mot pendant le chargement, et surtout : un mot qui RESTE si le
       manifeste nomme un fichier absent. L'amorceur avale les erreurs de
       chargement pour ne jamais geler, un panneau muet serait sinon la seule
       trace de la panne. -->
  <div id="nb"><p id="nb-attente">Chargement du plateau…<noscript> Le plateau a besoin de JavaScript.</noscript></p></div>
  <script>
  // JOUR / NUIT avant le premier rendu, comme la fiche : indice n=1/0 du hash
  // (posé par l'extension d'après le thème de Roll20), sinon le thème du
  // navigateur. Le plateau n'a pas de préférence à lui : il suit Roll20.
  (function () {
    "use strict";
    try {
      var h = location.hash || "";
      var on = /[#&]n=1/.test(h) ? true : /[#&]n=0/.test(h) ? false
             : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("night", on);
    } catch (e) {}
  })();
  (function () {
    "use strict";
    var DEFAUT = {
      js: ["javascripts/jjk-narration.js"],
      css: ["stylesheets/jjk-narration.css"]
    };
    var DELAI = 3000;

    function sure(u) {
      return typeof u === "string" && u &&
             !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) && u.indexOf("//") !== 0 &&
             u.indexOf("..") < 0;
    }
    function listeSure(l) { return Array.isArray(l) && l.length && l.every(sure); }

    function css(u) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = u;
      document.head.appendChild(l);
    }
    function serie(urls) {
      var i = 0;
      (function suivant() {
        if (i >= urls.length) return;
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = suivant;
        s.onerror = suivant;
        document.body.appendChild(s);
      })();
    }

    var parti = false;
    function une(m) {
      if (parti) return;
      parti = true;
      var n = m && m.narration;
      if (!n || !listeSure(n.js) || !listeSure(n.css)) n = DEFAUT;
      n.css.forEach(css);
      serie(n.js);
    }

    setTimeout(function () { une(null); }, DELAI);
    try {
      fetch("jjk-manifeste.json?t=" + new Date().getTime(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(une, function () { une(null); });
    } catch (e) { une(null); }
  })();
  </script>
</body>
</html>
