<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche JJK sur Roll20</title>
  <!-- Page servie par le site et affichée par l'extension Roll20 dans son
       iframe (architecture « coquille » : l'extension signée ne contient plus
       la fiche). Le VRAI créateur du site tourne ici : jjk-creation.css
       (source, sans réécriture), les polices auto-hébergées, puis le montage.
       jjk-creation.js est chargé par jjk-roll20-boot.js APRÈS l'hydratation
       depuis les Attributes Roll20, pour que son premier load() lise déjà
       l'état. Fichier copié tel quel par MkDocs (hors nav) :
       https://igneefleur.github.io/HxH-Regles-JDR/jjk/roll20-fiche.html -->
  <!-- suffixes ?v= : mêmes numéros que mkdocs.yml (jjk-creation.css/.js), à
       monter ensemble — sinon un JS/CSS en cache navigateur peut cohabiter
       ~10 min (max-age de GitHub Pages) avec un jjk-creation.json tout frais. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
  <link rel="stylesheet" href="stylesheets/jjk-creation.css?v=10">
  <style>
    /* Appoint iframe Roll20 (repris de l'ancien creator.css de l'extension).
       Le site fige la racine de la page Création à 22 px ; ici la page est un
       document autonome : on pose la même base directement sur html, les rem
       de jjk-creation.css s'y accrochent sans réécriture. */
    html { font-size: 22px; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #e4ddcd;   /* plan de travail (côtés), comme le site */
      font-family: 'Alegreya', 'EB Garamond', Garamond, serif;
    }
    .perso-atelier { min-height: 100vh; overflow-x: hidden; }

    /* La feuille REMPLIT la largeur du dialogue Roll20 (fluide) au lieu de la
       largeur fixe du site. box-sizing border-box : le padding de la feuille
       est INCLUS dans les 100 %, sinon il déborde à droite. */
    .perso-atelier .pc-sheet {
      width: 100% !important; max-width: none !important;
      box-sizing: border-box !important; margin-left: 0 !important; margin-right: 0 !important;
    }

    /* Dialogue trop étroit pour les colonnes -> 1 colonne, comme le mobile du
       site (point de bascule remonté à 60em : un dialogue Roll20 est plus
       étroit qu'une fenêtre de navigateur). */
    @media (max-width: 60em) {
      .pc-cols2 { grid-template-columns: 1fr !important; }
      .pc-comp-cols { flex-direction: column !important; align-items: stretch !important; }
      .pc-arts { grid-template-columns: 1fr !important; }
      .pc-id { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
      .pc-obj-wrap { flex-direction: column; }
      .pc-obj-panel { flex: 1 1 auto; width: 100%; }
    }

    /* message d'attente / d'orientation (retiré par l'amorce à l'hydratation) */
    #jjk-roll20-note {
      max-width: 24rem; margin: 2.2rem auto; padding: 0 1rem;
      font-size: .72rem; line-height: 1.5; color: #4c463a; text-align: center;
    }
    #jjk-roll20-note a { color: #667861; }
  </style>
</head>
<body>
  <div id="jjk-roll20-note">Connexion à Roll20…</div>
  <div id="perso-atelier"><noscript>La fiche a besoin de JavaScript.</noscript></div>
  <script src="javascripts/jjk-attr-map.js?v=2"></script>
  <script src="javascripts/jjk-roll20-boot.js?v=3"></script>
</body>
</html>
