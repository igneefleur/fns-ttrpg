<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche Outward sur Roll20</title>
  <!-- AMORCEUR GELÉ. Ne plus rien ajouter ici : ni feuille de style, ni
       script, ni numéro de version.

       Pourquoi. La coquille signée charge cette page en dur, SANS query
       (extension/firefox/<partie>/creator-shell.js, stable ou beta), et GitHub
       Pages la sert avec dix minutes de cache que le navigateur ne peut pas
       contourner. Tout ce qui est nommé ICI est donc figé pour dix minutes
       après chaque publication, et pour bien plus longtemps si un navigateur
       garde la page. Une page périmée qui nommerait un vieux script pourrait
       faire tourner une ancienne fiche sur des données neuves, sans le savoir.

       Alors cette page ne nomme plus rien : elle lit owd-manifeste.json, qui
       se relit SANS cache, et charge ce qu'il nomme. C'est le seul artefact
       irréductiblement périmable du dispositif, et il n'a plus de raison de
       changer.

       CE QUI EST FIGÉ ICI L'EST POUR TOUJOURS, en pratique, et c'est la liste
       entière : le nom du fichier de manifeste, l'id du div de note
       (owd-roll20-note), l'id de la racine de montage (perso-fiche, que le
       bundle cherche par cet id — les deux côtés doivent dire le même mot), la
       classe jour/nuit (.night sur <html>), la clé locale du jour/nuit
       (owd-r20-night), le marqueur de feuille (data-owd="1"), la feuille de
       polices, et la liste DEFAUT ci-dessous.

       Le repli DEFAUT n'existe que pour le jour où le manifeste serait absent,
       illisible ou trop lent : la fiche s'ouvre quand même. Il ne nomme pas le
       moteur de migrations — la fiche doit savoir s'ouvrir sans lui, et c'est
       ce qui donne son sens au garde-fou de migre() dans le bundle. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <div id="owd-roll20-note">Connexion à Roll20…</div>
  <div id="perso-fiche"><noscript>La fiche a besoin de JavaScript.</noscript></div>
  <script>
  // JOUR / NUIT, tout de suite. Cette poignée de lignes doit rester ICI, dans
  // l'amorceur : elle s'exécute AVANT le premier rendu. Passée à l'amorce, qui
  // n'arrive qu'après la lecture du manifeste, elle ferait clignoter la fiche
  // en clair avant de basculer en sombre. La règle ne changera plus :
  // préférence locale, sinon l'indice n=1/0 du hash (posé par l'extension
  // d'après le thème de Roll20), sinon le thème du navigateur. L'amorce la
  // rejoue.
  (function () {
    "use strict";
    try {
      var h = location.hash || "";
      var p = null;
      try { p = localStorage.getItem("owd-r20-night"); } catch (e) {}
      var on = p === "1" ? true : p === "0" ? false
             : /[#&]n=1/.test(h) ? true : /[#&]n=0/.test(h) ? false
             : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("night", on);
    } catch (e) {}
  })();
  (function () {
    "use strict";
    // Repli : ce que l'on charge si le manifeste ne répond pas. Volontairement
    // sans ?v= — mieux vaut un fichier de cache qu'aucune fiche.
    var DEFAUT = {
      amorce: ["javascripts/owd-attr-map.js", "javascripts/owd-roll20-boot.js"],
      bundle: {
        js: ["javascripts/owd-fiche.js"],
        css: ["stylesheets/owd-fiche.css", "stylesheets/owd-roll20.css"],
        data: null
      }
    };
    var DELAI = 3000;   // un fetch qui PEND ne rejette jamais : on le borne

    // Une URL de manifeste doit rester dans le site : relative, sans schéma ni
    // « // », sans remontée de dossier. Sinon on refuse tout le manifeste.
    function sure(u) {
      return typeof u === "string" && u &&
             !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) && u.indexOf("//") !== 0 &&
             u.indexOf("..") < 0;
    }
    function listeSure(l) {
      return Array.isArray(l) && l.length && l.every(sure);
    }
    function valide(m) {
      if (!m || typeof m !== "object") return false;
      if (!listeSure(m.amorce)) return false;
      var b = m.bundle;
      if (!b || typeof b !== "object" || !listeSure(b.js) || !listeSure(b.css)) return false;
      return b.data == null || sure(b.data);
    }

    function css(u) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = u;
      l.setAttribute("data-owd", "1");
      document.head.appendChild(l);
    }
    // Les scripts s'injectent EN SÉRIE : owd-attr-map doit être là avant
    // l'amorce, et l'amorce avant tout le reste.
    function serie(urls, fini) {
      var i = 0;
      (function suivant() {
        if (i >= urls.length) { if (fini) fini(); return; }
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = suivant;
        s.onerror = suivant;   // un manquant ne doit pas geler la file
        document.body.appendChild(s);
      })();
    }

    function lancer(m) {
      window.__owdManifeste = m;   // l'amorce y lit le bundle, la version, les archives
      (m.bundle.css || []).forEach(css);
      serie(m.amorce);
    }

    var parti = false;
    function une(m) {
      if (parti) return;
      parti = true;
      // Un manifeste à moitié cru serait pire que pas de manifeste du tout :
      // c'est DEFAUT en entier, ou le manifeste en entier, jamais un mélange.
      lancer(valide(m) ? m : DEFAUT);
    }

    setTimeout(function () { une(null); }, DELAI);
    try {
      // ?t= : ne pas nettoyer. Il change la clé de cache du CDN, que
      // « cache: no-store » seul ne contourne pas.
      fetch("owd-manifeste.json?t=" + new Date().getTime(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(une, function () { une(null); });
    } catch (e) { une(null); }
  })();
  </script>
</body>
</html>
