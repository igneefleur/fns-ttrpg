site_name: Outward Système JDR
site_url: https://igneefleur.github.io/fns-ttrpg/owd-beta/
# Repris en pied de CHAQUE page (et du PDF, le jour où le livre en justifiera un).
# Voir LICENSE.md : tous droits réservés sur les apports originaux ; œuvre de fan,
# sans lien avec les ayants droit d'Outward.
copyright: © 2026 IgneeFleur. Tous droits réservés. Œuvre de fan, non affiliée à Nine Dots Studio.
# Le lisez-moi des polices accompagne les fichiers .woff2 et leurs licences ; il
# n'a rien à faire dans le site publié, où mkdocs en ferait une page.
exclude_docs: |
  assets/fonts/LISEZMOI.md
nav:
  - Accueil: index.md
  - Règles:
      - content/regles/index.md
      - Les Bases:
          - Actions et compétences: content/regles/base/actions.md
          - Compétences: content/regles/base/competences.md
          - Techniques: content/regles/base/techniques.md
          - Caractéristiques: content/regles/base/caracteristiques.md
          - Capacités physiques: content/regles/base/capacites-physiques.md
      - Le Combat:
          - Portées: content/regles/combat/portees.md
          - Armes: content/regles/combat/armes.md
  # La fiche de personnage, servie par le site et non par l'extension : la même
  # page monte la fiche ici, hors Roll20, et dans l'iframe de la coquille signée.
  - Personnage: personnage/index.md
  - Extension: extension/index.md
theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    scheme: default
    primary: custom
    accent: custom
  # false = Material n'appelle PAS Google Fonts. Les polices sont auto-hébergées
  # (docs/assets/fonts/ + stylesheets/fonts.css) ; les variables --md-text-font et
  # --md-code-font sont redéclarées dans extra.css.
  font: false
  features:
    - navigation.instant  # navigation SPA : pas de rechargement complet (pas de flash)
    - navigation.tabs        # barre horizontale en haut
    - navigation.tabs.sticky # la barre reste collée (hauteur d'en-tête constante)
    - navigation.expand      # arborescence dépliée par défaut
    - navigation.indexes
    - navigation.footer      # liens page précédente / suivante (requis pour le défilement continu)
    - content.tooltips
extra:
  generator: false   # supprime le « Made with Material for MkDocs »
extra_css:
  - stylesheets/fonts.css   # @font-face auto-hébergés : doit être chargée en premier
  - stylesheets/extra.css?v=13
  - stylesheets/night.css
  - stylesheets/armes.css?v=1
  # LES ?v= DE LA FICHE SE MONTENT PAR OUTIL, JAMAIS À LA MAIN, et tous
  # ensemble : scripts/release_fiche.py les pose ici ET dans
  # docs/owd-manifeste.json, sur un seul numéro commun. Le site charge la fiche
  # par ces deux listes, Roll20 la charge par le manifeste ; deux clés de cache
  # qui divergent, et les deux mondes font tourner deux codes en croyant faire
  # tourner le même. Un fichier monté d'un seul côté ne se voit pas.
  - stylesheets/owd-fiche.css?v=2
extra_javascript:
  - javascripts/changelog.js
  - javascripts/continuous.js
  - javascripts/nav-drawer.js
  - javascripts/night.js
  - javascripts/owd-migrations.js?v=2 # moteur de migration : AVANT le bundle, qui l'appelle
  - javascripts/owd-mods.js?v=2       # moteur de mods : AVANT la fiche, qui l'interroge (et facultatif de naissance)
  - javascripts/owd-fiche.js?v=2
  - javascripts/copybtn.js
hooks:
  - hooks/changelog.py
  - hooks/armes.py
  # Produit owd-creation.json depuis docs/content/regles/ : le barème des rangs,
  # les formules des capacités, les caractéristiques, les armes et leurs paliers.
  # Les données viennent des règles, jamais du code. Une page ABSENTE (chapitre
  # pas encore écrit ou pas encore committé) voit sa section omise et le hook le
  # dit au journal ; une page PRÉSENTE mais illisible casse le build, parce que
  # c'est une règle qui a changé de forme sans qu'il le sache.
  - hooks/owd_creation.py
plugins:
  - search
markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
