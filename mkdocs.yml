site_name: MIA Système JDR
site_url: https://igneefleur.github.io/fns-ttrpg/mia-beta/
# Voir LICENSE.md : les règles sont d'Erua et ses droits sur elles lui restent ;
# le site, le code et les outils sont d'IgneeFleur, tous droits réservés. Œuvre
# de fan, sans lien avec les ayants droit de Made in Abyss.
copyright: Règles © 2026 Erua. Site et code © 2026 IgneeFleur. Tous droits réservés. Œuvre de fan, non affiliée à Takeshobo.
exclude_docs: |
  assets/fonts/LISEZMOI.md

# La page d'accueil ne fait que rediriger vers les règles : pas d'entrée de nav.
not_in_nav: |
  index.md
nav:
  - Règles: content/regles/index.md
  - Création: personnage/index.md
  - Mods: content/mods/index.md
  - Extension: extension/index.md
theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    scheme: default
    primary: custom
    accent: custom
  # false = Material n'appelle PAS Google Fonts. Les polices sont auto-hébergées
  # (docs/assets/fonts/ + stylesheets/fonts.css) ; les variables --md-text-font et
  # --md-code-font sont redéclarées dans extra.css.
  font: false
  features:
    - navigation.instant  # navigation SPA : pas de rechargement complet (pas de flash)
    - navigation.tabs        # barre horizontale en haut
    - navigation.tabs.sticky # la barre reste collée (hauteur d'en-tête constante)
    - navigation.expand      # arborescence dépliée par défaut
    - navigation.indexes
    - navigation.footer      # liens page précédente / suivante (requis pour le défilement continu)
    - content.tooltips
extra:
  generator: false   # supprime le « Made with Material for MkDocs »
extra_css:
  - stylesheets/fonts.css   # @font-face auto-hébergés : doit être chargée en premier
  - stylesheets/extra.css?v=13
  - stylesheets/night.css
  - stylesheets/mia.css?v=1 # variantes propres à la branche mia (gabarit des tables anima)
  - stylesheets/mia-fiche.css?v=74
extra_javascript:
  - javascripts/continuous.js
  - javascripts/nav-drawer.js
  - javascripts/night.js
  - javascripts/mia-migrations.js?v=74 # moteur de migration : AVANT le bundle, qui l'appelle
  - javascripts/mia-mods.js?v=74       # moteur de mods : AVANT le bundle aussi, et facultatif (sans lui, la fiche s'ouvre sans mods)
  - javascripts/mia-fiche.js?v=74
  - javascripts/copybtn.js
hooks:
  - hooks/mia_creation.py
plugins:
  - search
markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
