<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche Jujutsu Kaisen sur Roll20</title>
  <!-- AMORCEUR GELÉ. Ne plus rien ajouter ici : ni feuille de style, ni
       script, ni numéro de version.

       Pourquoi. La coquille signée charge cette page en dur, SANS query
       (extension/firefox/<partie>/creator-shell.js, stable ou beta), et GitHub Pages la sert avec dix
       minutes de cache que le navigateur ne peut pas contourner. Tout ce qui
       est nommé ICI est donc figé pour dix minutes après chaque publication,
       et pour bien plus longtemps si un navigateur garde la page. Une page
       périmée qui nommerait un vieux script pourrait faire tourner une
       ancienne fiche sur des données neuves, sans le savoir.

       Alors cette page ne nomme plus rien : elle lit jjk-manifeste.json, qui
       se relit SANS cache, et charge ce qu'il nomme. C'est le seul artefact
       irréductiblement périmable du dispositif, et il n'a plus de raison de
       changer.

       Il n'existe AUCUN bundle de repli. Si le manifeste ou un fichier
       obligatoire manque, un écran bloquant apparaît : ouvrir une fiche
       partiellement chargée risquerait de réécrire des données sans les lire. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <div id="jjk-roll20-note" role="status"><h1>Chargement du personnage</h1><p>Vérification de l’extension…</p></div>
  <div id="perso-atelier"><noscript>La fiche a besoin de JavaScript.</noscript></div>
  <script>
  // JOUR / NUIT, tout de suite. Cette poignée de lignes doit rester ICI, dans
  // l'amorceur : elle s'exécute AVANT le premier rendu. Passée à l'amorce, qui
  // n'arrive qu'après la lecture du manifeste, elle ferait clignoter la fiche
  // en clair avant de basculer en sombre. La règle ne changera plus : indice
  // n=1/0 du hash (posé par l'extension d'après le thème de Roll20), sinon la
  // préférence locale, sinon le thème du navigateur. L'amorce la rejoue.
  (function () {
    "use strict";
    var termine = false;
    // Secours ultime si une ressource ne déclenche ni load ni error.
    // Les étapes normales ont leurs propres délais plus courts dans l'amorce.
    var delai = 90000;
    var timer = null;

    function urlSure(u) {
      return typeof u === "string" && !!u &&
        !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) &&
        u.indexOf("//") !== 0 && u.indexOf("..") < 0 &&
        !/[\u0000-\u001f]/.test(u);
    }
    function listeSure(l, videAutorisee) {
      return Array.isArray(l) && (videAutorisee || l.length > 0) && l.every(urlSure);
    }
    function versionSure(v) {
      return typeof v === "string" && /^\d+\.\d+\.\d+b?$/.test(v);
    }
    function versionExtensionSure(v) {
      return typeof v === "string" && /^\d+\.\d+\.\d+(?:\.\d+)?$/.test(v);
    }
    function valide(m) {
      if (!m || typeof m !== "object" || !versionSure(m.release) ||
          !Number.isInteger(m.schema) || m.schema < 1 ||
          !listeSure(m.amorce, false)) return false;
      var b = m.bundle;
      if (!b || typeof b !== "object" || !listeSure(b.js, false) ||
          !listeSure(b.css, false) || (b.data != null && !urlSure(b.data)) ||
          b.compactStorage !== true) return false;
      var ext = m.extension;
      if (!ext || !versionExtensionSure(ext.minVersion) || ext.bridgeProtocol !== 2 ||
          !Array.isArray(ext.requiredCapabilities) || !ext.requiredCapabilities.length ||
          !ext.requiredCapabilities.every(function (x) {
            return typeof x === "string" && /^[a-zA-Z][a-zA-Z0-9]*$/.test(x);
          })) return false;
      return true;
    }
    function afficherErreur() {
      if (timer) clearTimeout(timer);
      window.__jjkOpeningDone = true;
      termine = true;
      var note = document.getElementById("jjk-roll20-note");
      if (!note) {
        note = document.createElement("div");
        note.id = "jjk-roll20-note";
        document.body.insertBefore(note, document.body.firstChild);
      }
      note.textContent = "";
      var h = document.createElement("h1");
      h.textContent = "Impossible d’ouvrir le personnage";
      var p = document.createElement("p");
      p.textContent = "Les fichiers nécessaires au fonctionnement de la fiche n’ont pas pu être chargés. Réessayez dans quelques instants.";
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "Réessayer";
      b.addEventListener("click", function () { try { location.reload(); } catch (e) {} });
      var exportButton = document.createElement("button");
      exportButton.type = "button";
      exportButton.textContent = "Exporter les données disponibles";
      exportButton.disabled = true;
      exportButton.title = "Aucune donnée du personnage disponible à exporter.";
      var noteExport = document.createElement("p");
      noteExport.textContent = "Aucune donnée du personnage disponible à exporter.";
      note.appendChild(h); note.appendChild(p); note.appendChild(b); note.appendChild(exportButton); note.appendChild(noteExport);
    }
    function chargerCss(urls, fini) {
      var i = 0;
      function suivant() {
        if (termine) return;
        if (i >= urls.length) { fini(); return; }
        var u = urls[i++], l = document.createElement("link"), fini = false;
        l.rel = "stylesheet"; l.href = u; l.setAttribute("data-jjk", "1");
        var delai = setTimeout(function () {
          if (fini) return; fini = true; afficherErreur();
        }, 15000);
        l.onload = function () { if (fini) return; fini = true; clearTimeout(delai); suivant(); };
        l.onerror = function () {
          if (fini) return; fini = true; clearTimeout(delai); afficherErreur();
        };
        document.head.appendChild(l);
      }
      suivant();
    }
    function chargerScripts(urls, fini) {
      var i = 0;
      function suivant() {
        if (termine) return;
        if (i >= urls.length) { fini(); return; }
        var u = urls[i++], script = document.createElement("script"), fini = false;
        script.src = u;
        var delai = setTimeout(function () {
          if (fini) return; fini = true; afficherErreur();
        }, 15000);
        script.onload = function () { if (fini) return; fini = true; clearTimeout(delai); suivant(); };
        script.onerror = function () {
          if (fini) return; fini = true; clearTimeout(delai); afficherErreur();
        };
        document.body.appendChild(script);
      }
      suivant();
    }
    function lancer(m) {
      if (termine) return;
      window.__jjkManifeste = m;
      chargerCss(m.bundle.css, function () {
        chargerScripts(m.amorce, function () {
          if (!window.JjkSync || !window.JjkSync.Compact ||
              !window.JjkAttrMap || typeof window.JjkAttrMap.attrsToState !== "function" ||
              typeof window.JjkAttrMap.stateToAttrs !== "function" ||
              !window.JjkAttrMap.PREFIX || !window.__jjkRoll20BootReady) {
            afficherErreur();
            return;
          }
          termine = true;
        });
      });
    }
    function recevoir(m) {
      if (termine) return;
      if (!valide(m)) {
        afficherErreur();
        return;
      }
      lancer(m);
    }
    timer = setTimeout(function () {
      if (window.__jjkOpeningDone) return;
      afficherErreur();
    }, delai);
    try {
      fetch("jjk-manifeste.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
          return r.json();
        })
        .then(recevoir, function () {
          afficherErreur();
        });
    } catch (e) {
      afficherErreur();
    }
  })();
  </script>
</body>
</html>
