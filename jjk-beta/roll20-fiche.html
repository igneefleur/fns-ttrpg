<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche JJK sur Roll20</title>
  <!-- Page servie par le site et affichée par l'extension Roll20 dans son
       iframe (architecture « coquille » : l'extension signée ne contient plus
       la fiche). Le VRAI créateur du site tourne ici : jjk-creation.css
       (source, sans réécriture), les polices auto-hébergées, puis le montage.
       jjk-creation.js est chargé par jjk-roll20-boot.js APRÈS l'hydratation
       depuis les Attributes Roll20, pour que son premier load() lise déjà
       l'état. Fichier copié tel quel par MkDocs (hors nav) :
       https://igneefleur.github.io/HxH-Regles-JDR/jjk-beta/roll20-fiche.html -->
  <!-- suffixes ?v= : mêmes numéros que mkdocs.yml (jjk-creation.css/.js), à
       monter ensemble — sinon un JS/CSS en cache navigateur peut cohabiter
       ~10 min (max-age de GitHub Pages) avec un jjk-creation.json tout frais. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
  <link rel="stylesheet" href="stylesheets/jjk-creation.css?v=28">
  <style>
    /* Appoint iframe Roll20 (repris de l'ancien creator.css de l'extension).
       LARGEUR DE RÉFÉRENCE : le demi-écran (~940 px de fenêtre). La racine
       passe de 22 px (site) à 18 px : la feuille native de 50rem fait alors
       900 px et tient, EN 3 COLONNES, dans une fenêtre en demi-écran. Plus
       large (popout plein écran), la feuille ne s'étire pas (une fiche n'a
       pas besoin d'être plus large) : elle reste à 900 px, centrée. Plus
       étroit, elle se comprime, puis les colonnes tombent (voir plus bas). */
    /* jjk-creation.css épingle la racine du site à 22 px (html:has(#perso-atelier)
       !important) : on la contre-épingle ICI, même sélecteur + !important, posé
       APRÈS le link donc gagnant. Ne pas revenir à un simple `html {}`. */
    html, html:has(#perso-atelier) { font-size: 18px !important; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #e4ddcd;   /* plan de travail (côtés), comme le site */
      font-family: 'Alegreya', 'EB Garamond', Garamond, serif;
    }
    .perso-atelier { min-height: 100vh; overflow-x: hidden; }

    /* La feuille garde sa largeur NATIVE (50rem) et se centre (margin auto du
       site) ; dans un dialogue plus étroit elle se comprime au lieu de défiler
       (le site, lui, défile). box-sizing border-box : le padding est INCLUS
       dans la largeur, sinon il déborde à droite. */
    .perso-atelier .pc-sheet { max-width: 100%; box-sizing: border-box; }

    /* Le site repasse en 1 colonne sous 44em ; à l'échelle Roll20 (racine
       18 px, contenu ~18 % plus compact), les colonnes restent lisibles plus
       bas : on les maintient jusqu'à 36em (dialogue de l'éditeur compris).
       Sous 36em, les règles 44em du site (1 colonne, identité en 6 colonnes,
       inventaire empilé) reprennent la main. */
    @media (min-width: 36em) and (max-width: 44em) {
      .pc-cols-fiche { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); }
      .pc-cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pc-arts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* message d'attente / d'orientation (retiré par l'amorce à l'hydratation) */
    #jjk-roll20-note {
      max-width: 24rem; margin: 2.2rem auto; padding: 0 1rem;
      font-size: .72rem; line-height: 1.5; color: #4c463a; text-align: center;
    }
    #jjk-roll20-note a { color: #667861; }
  </style>
</head>
<body>
  <div id="jjk-roll20-note">Connexion à Roll20…</div>
  <div id="perso-atelier"><noscript>La fiche a besoin de JavaScript.</noscript></div>
  <script src="javascripts/jjk-attr-map.js?v=8"></script>
  <script src="javascripts/jjk-roll20-boot.js?v=23"></script>
</body>
</html>
