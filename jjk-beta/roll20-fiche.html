<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche JJK sur Roll20</title>
  <!-- AMORCEUR GELÉ. Ne plus rien ajouter ici : ni feuille de style, ni
       script, ni numéro de version.

       Pourquoi. La coquille signée charge cette page en dur, SANS query
       (extension/firefox/<partie>/creator-shell.js, stable ou beta), et GitHub Pages la sert avec dix
       minutes de cache que le navigateur ne peut pas contourner. Tout ce qui
       est nommé ICI est donc figé pour dix minutes après chaque publication,
       et pour bien plus longtemps si un navigateur garde la page. Une page
       périmée qui nommerait un vieux script pourrait faire tourner une
       ancienne fiche sur des données neuves, sans le savoir.

       Alors cette page ne nomme plus rien : elle lit jjk-manifeste.json, qui
       se relit SANS cache, et charge ce qu'il nomme. C'est le seul artefact
       irréductiblement périmable du dispositif, et il n'a plus de raison de
       changer.

       Il n'existe AUCUN bundle de repli. Si le manifeste ou un fichier
       obligatoire manque, un écran bloquant apparaît : ouvrir une fiche
       partiellement chargée risquerait de réécrire des données sans les lire. -->
  <link rel="stylesheet" href="stylesheets/fonts.css">
</head>
<body>
  <div id="jjk-roll20-note">Connexion à Roll20…</div>
  <div id="perso-atelier"><noscript>La fiche a besoin de JavaScript.</noscript></div>
  <script>
  // JOUR / NUIT, tout de suite. Cette poignée de lignes doit rester ICI, dans
  // l'amorceur : elle s'exécute AVANT le premier rendu. Passée à l'amorce, qui
  // n'arrive qu'après la lecture du manifeste, elle ferait clignoter la fiche
  // en clair avant de basculer en sombre. La règle ne changera plus : indice
  // n=1/0 du hash (posé par l'extension d'après le thème de Roll20), sinon la
  // préférence locale, sinon le thème du navigateur. L'amorce la rejoue.
  (function () {
    "use strict";
    var termine = false;
    var delai = 8000;
    var timer = null;

    function urlSure(u) {
      return typeof u === "string" && !!u &&
        !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) &&
        u.indexOf("//") !== 0 && u.indexOf("..") < 0 &&
        !/[\u0000-\u001f]/.test(u);
    }
    function listeSure(l, videAutorisee) {
      return Array.isArray(l) && (videAutorisee || l.length > 0) && l.every(urlSure);
    }
    function versionSure(v) {
      return typeof v === "string" && /^\d+\.\d+\.\d+b?$/.test(v);
    }
    function valide(m) {
      if (!m || typeof m !== "object" || !versionSure(m.release) ||
          !Number.isInteger(m.schema) || m.schema < 1 ||
          !listeSure(m.amorce, false)) return false;
      var b = m.bundle;
      if (!b || typeof b !== "object" || !listeSure(b.js, false) ||
          !listeSure(b.css, false) || (b.data != null && !urlSure(b.data)) ||
          b.compactStorage !== true) return false;
      var ext = m.extension;
      if (!ext || !versionSure(ext.minVersion) || ext.bridgeProtocol !== 2 ||
          !Array.isArray(ext.requiredCapabilities) || !ext.requiredCapabilities.length ||
          !ext.requiredCapabilities.every(function (x) {
            return typeof x === "string" && /^[a-zA-Z][a-zA-Z0-9]*$/.test(x);
          })) return false;
      return true;
    }
    function afficherErreur(titre, message) {
      if (timer) clearTimeout(timer);
      termine = true;
      var note = document.getElementById("jjk-roll20-note");
      if (!note) {
        note = document.createElement("div");
        note.id = "jjk-roll20-note";
        document.body.insertBefore(note, document.body.firstChild);
      }
      note.textContent = "";
      note.setAttribute("role", "alertdialog");
      note.setAttribute("aria-live", "assertive");
      note.style.cssText = "position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;" +
        "justify-content:center;align-items:center;gap:.8rem;padding:1.5rem;box-sizing:border-box;" +
        "background:#f5ecdc;color:#3a2c1c;font:16px/1.5 Georgia,serif;text-align:center";
      var h = document.createElement("h1");
      h.textContent = titre;
      h.style.cssText = "max-width:36rem;margin:0;font-size:1.35rem";
      var p = document.createElement("p");
      p.textContent = message;
      p.style.cssText = "max-width:36rem;margin:0";
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "Recharger la fiche";
      b.style.cssText = "padding:.55rem 1rem;border:1px solid #806548;border-radius:4px;" +
        "background:#4c3a24;color:#fffaf0;font:700 .9rem Georgia,serif;cursor:pointer";
      b.addEventListener("click", function () { try { location.reload(); } catch (e) {} });
      note.appendChild(h); note.appendChild(p); note.appendChild(b);
      document.documentElement.setAttribute("data-jjk-opening-error", "1");
    }
    function chargerCss(urls, fini) {
      var i = 0;
      function suivant() {
        if (termine) return;
        if (i >= urls.length) { fini(); return; }
        var u = urls[i++], l = document.createElement("link");
        l.rel = "stylesheet"; l.href = u; l.setAttribute("data-jjk", "1");
        l.onload = suivant;
        l.onerror = function () {
          afficherErreur("Impossible de charger la fiche JJK",
            "La feuille de style obligatoire « " + u + " » n'a pas pu être chargée. Aucune fiche partielle ne sera ouverte.");
        };
        document.head.appendChild(l);
      }
      suivant();
    }
    function chargerScripts(urls, fini) {
      var i = 0;
      function suivant() {
        if (termine) return;
        if (i >= urls.length) { fini(); return; }
        var u = urls[i++], script = document.createElement("script");
        script.src = u;
        script.onload = suivant;
        script.onerror = function () {
          afficherErreur("Chargement interrompu",
            "Le script obligatoire « " + u + " » n'a pas pu être chargé. Le montage a été arrêté pour éviter une fiche incomplète.");
        };
        document.body.appendChild(script);
      }
      suivant();
    }
    function lancer(m) {
      if (termine) return;
      window.__jjkManifeste = m;
      chargerCss(m.bundle.css, function () {
        chargerScripts(m.amorce, function () {
          if (!window.JjkSync || !window.JjkSync.Compact ||
              !window.JjkAttrMap || typeof window.JjkAttrMap.attrsToState !== "function" ||
              typeof window.JjkAttrMap.stateToAttrs !== "function" ||
              !window.JjkAttrMap.PREFIX || !window.__jjkRoll20BootReady) {
            afficherErreur("Initialisation incomplète",
              "Les fichiers ont été téléchargés, mais les composants essentiels de la fiche ne sont pas disponibles. Aucune donnée ne sera modifiée.");
            return;
          }
          termine = true;
          if (timer) clearTimeout(timer);
        });
      });
    }
    function recevoir(m) {
      if (termine) return;
      if (!valide(m)) {
        afficherErreur("Impossible de vérifier la version de la fiche",
          "Le manifeste de JJK est absent, incomplet ou invalide. La fiche n'a pas été ouverte et aucune donnée n'a été écrite. Vérifiez le déploiement du site puis rechargez.");
        return;
      }
      lancer(m);
    }
    timer = setTimeout(function () {
      afficherErreur("Le manifeste JJK ne répond pas",
        "Le serveur n'a pas fourni le manifeste de version dans le délai prévu. Pour protéger les données, aucun ancien bundle de secours ne sera chargé.");
    }, delai);
    try {
      fetch("jjk-manifeste.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
          return r.json();
        })
        .then(recevoir, function () {
          afficherErreur("Impossible de lire le manifeste JJK",
            "Le manifeste de version est inaccessible ou son JSON est invalide. Aucune fiche ne sera montée sur un bundle de repli.");
        });
    } catch (e) {
      afficherErreur("Impossible de lire le manifeste JJK",
        "Le navigateur n'a pas pu démarrer la lecture du manifeste. Aucune donnée n'a été modifiée.");
    }
  })();
  </script>
</body>
</html>
