name: website deployment
on:
  push:
    branches:
      - jjk
  workflow_dispatch: {}   # relance manuelle (ex. quota AMO retombé)
permissions:
  contents: write
# Les cinq branches écrivent sur la même branche gh-pages, chacune dans son
# dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances Python
        run: pip install mkdocs-material requests
      # LE FICHIER SERVI DOIT CORRESPONDRE À SES MORCEAUX, et c'est ici qu'on le
      # vérifie — avant de construire quoi que ce soit. Un morceau modifié sans
      # réassemblage passe « git status » sans un mot : le dépôt paraît propre et
      # le site déploie l'ancien code, sans que rien n'échoue. On VÉRIFIE sans
      # écrire : la chaîne ne doit pas réparer en silence ce qui n'a pas été
      # fait, sinon le dépôt garde durablement des sources et des fichiers servis
      # qui divergent.
      - name: Assemblage à jour
        run: python scripts/assembler.py --verifie
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"   # coupe l'encadré promo « MkDocs 2.0 » de Material dans les logs
        run: mkdocs build
      # Extension : re-signature Mozilla AUTOMATIQUE quand la COQUILLE
      # (extension/) change — la fiche est servie par le site
      # (roll20-fiche.html), les règles et le créateur ne re-signent plus rien.
      # Version montée toute seule, .xpi signé + updates.json republiés : les
      # Firefox installés se mettent à jour sans rien faire. Clés = secrets du dépôt.
      - name: Extension (re-signature automatique si changement)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python scripts/ci_extension.py
      # CE PAS DIT SI LE PAQUET A BOUGÉ, et c'est lui qui commande les deux
      # suivants. Il remplace un `if: inputs.signer` qui ne pouvait pas marcher
      # ICI : cette entrée n'existe que sur le workflow de jjk-beta, où la
      # signature est manuelle. Sur cette branche-ci, la signature est
      # AUTOMATIQUE, `inputs.signer` était donc toujours vide, le rebuild
      # toujours sauté — et le site repartait avec les téléchargements d'AVANT la
      # signature, pendant que la branche, elle, portait bien le nouveau .xpi.
      # Un joueur voyait alors une version signée depuis longtemps ne jamais lui
      # parvenir. Rien n'échouait nulle part.
      - name: Le paquet a-t-il changé ?
        id: paquet
        run: |
          if git diff --quiet -- docs/download; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "Aucune re-signature : les téléchargements servis restent bons."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            echo "Extension re-signée : rebuild du site pour embarquer le paquet neuf."
          fi
      # LE SECOND BUILD NE SERT QU'À LA SIGNATURE, et à rien d'autre. Le seul pas
      # qui touche à docs/ entre les deux est celui du dessus : il réécrit
      # docs/download/ (le .xpi signé, updates.json, l'empreinte, les manifests),
      # et sans ce rebuild le site partirait avec les téléchargements d'avant.
      # Sur un push ordinaire, ce pas est sauté et rien ne bouge entre les deux
      # builds : mkdocs refabriquait alors site/ à l'identique, à chaque push, et
      # une étape qui ne peut rien changer finit par être crue là où elle compte.
      - name: Rebuild (téléchargements à jour)
        if: steps.paquet.outputs.change == 'true'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build
      # La re-signature modifie manifests, archives, updates.json et empreinte :
      # on les recommitte sur la branche ([skip ci] : pas de nouveau run).
      - name: Republier l'extension re-signée sur la branche
        if: steps.paquet.outputs.change == 'true'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "CI : extension re-signée automatiquement [skip ci]"
            # si la branche a avancé pendant le run : rebaser en préférant NOS
            # artefacts (les binaires fraîchement signés), sinon le rebase
            # échoue sur les archives et la version signée reste orpheline
            git push || (git pull --rebase -X theirs && git push)
          fi
      # Un seul site GitHub Pages (branche gh-pages), CINQ emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (le hub)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/      (CE workflow)
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/
      #
      # LE DOSSIER jjk/ NE SE RENOMME PAS, quoi qu'il arrive à la branche. Ce
      # chemin est cuit dans le paquet SIGNÉ que les joueurs ont installé —
      # adresse de la fiche et adresse des mises à jour — et rien ne redirige :
      # le changer leur coûterait une réinstallation manuelle à chacun, plus une
      # signature Mozilla. Le nom de la branche, lui, est interne et se renomme
      # sans conséquence ; c'est d'ailleurs ce qui a été fait deux fois le même
      # jour. Ne pas déduire de leur nom identique qu'ils sont liés.
      #
      # Avec target-folder, « clean » ne nettoie QUE le dossier cible : les quatre
      # autres emplacements sont épargnés par ce déploiement.
      - name: Déploiement JJK officiel (jjk -> jjk/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          target-folder: jjk
          clean: true
          force: false
      # L'EXTENSION EST UNIQUE : ELLE SE PUBLIE AUX DEUX ADRESSES. Symétrique de
      # ce que fait le workflow de jjk-beta, et pour la même raison : le paquet
      # porte les deux moitiés, la case du popup choisit, il n'y a donc pas une
      # extension par branche. Sans cela, l'adresse qui n'a pas déployé en
      # dernier sert un paquet périmé.
      - name: L'extension signée va aussi sur jjk-beta (download/ seul)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/download
          branch: gh-pages
          target-folder: jjk-beta/download
          clean: false
          force: false
