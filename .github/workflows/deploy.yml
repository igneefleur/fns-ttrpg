name: website deployment
on:
  push:
    branches:
      - mia
  workflow_dispatch: {}   # relance manuelle (ex. quota AMO retombé)
permissions:
  contents: write
# LA PREMIÈRE SIGNATURE CRÉE L'ADD-ON CHEZ MOZILLA, et c'est voulu.
#
# ATTENTION, c'est ICI que ça compte le plus : sur cette branche la signature est
# AUTOMATIQUE, sans case à cocher. Le moindre envoi la déclenche.
#
# L'extension MIA porte un identifiant NEUF, mia-roll20@igneefleur, que Mozilla
# ne connaît pas. Or sign_extension.create_version() commence par un POST sur
# /addons/addon/, c'est-à-dire une CRÉATION : la première signature fait NAÎTRE
# l'add-on sur le compte, en unlisted, sous le « name » du manifeste — « Fiche
# MIA sur Roll20 ». Vérifier ce nom AVANT de pousser, il engage, et chaque
# soumission mord sur un quota serré.
#
# Les secrets AMO_JWT_ISSUER et AMO_JWT_SECRET doivent être là ; ils avaient déjà
# disparu une fois après un renommage de dépôt.
#
# Les neuf branches écrivent sur la même branche gh-pages, chacune dans son
# dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances Python
        run: pip install mkdocs-material requests
      # LE FICHIER SERVI DOIT CORRESPONDRE À SES MORCEAUX, et c'est ici qu'on le
      # vérifie — avant de construire quoi que ce soit. Un morceau modifié sans
      # réassemblage passe « git status » sans un mot : le dépôt paraît propre et
      # le site déploie l'ancien code, sans que rien n'échoue. On VÉRIFIE sans
      # écrire : la chaîne ne doit pas réparer en silence ce qui n'a pas été
      # fait, sinon le dépôt garde durablement des sources et des fichiers servis
      # qui divergent.
      - name: Assemblage à jour
        run: python scripts/assembler.py --verifie
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"   # coupe l'encadré promo « MkDocs 2.0 » de Material dans les logs
        run: mkdocs build
      # Extension : re-signature Mozilla AUTOMATIQUE quand la COQUILLE
      # (extension/) change — la fiche est servie par le site
      # (roll20-fiche.html), les règles et le créateur ne re-signent plus rien.
      # Version montée toute seule, .xpi signé + updates.json republiés : les
      # Firefox installés se mettent à jour sans rien faire. Clés = secrets du dépôt.
      - name: Extension (re-signature automatique si changement)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python scripts/ci_extension.py
      # CE PAS DIT SI LE PAQUET A BOUGÉ, et c'est lui qui commande les deux
      # suivants. Il remplace un `if: inputs.signer` qui ne pouvait pas marcher
      # ICI : cette entrée n'existe que sur le workflow de mia-beta, où la
      # signature est manuelle. Sur cette branche-ci, la signature est
      # AUTOMATIQUE, `inputs.signer` était donc toujours vide, le rebuild
      # toujours sauté — et le site repartait avec les téléchargements d'AVANT la
      # signature, pendant que la branche, elle, portait bien le nouveau .xpi.
      # Un joueur voyait alors une version signée depuis longtemps ne jamais lui
      # parvenir. Rien n'échouait nulle part.
      #
      # « git diff » NE VOIT PAS LES FICHIERS NON SUIVIS, et c'est ce qui a coûté
      # la première signature MIA. docs/download/ avait été retiré du dépôt avec
      # le paquet JJK : tout ce que la signature y écrit est donc NEUF, donc
      # invisible à git diff. Le pas a répondu « rien n'a changé », le rebuild et
      # le recommit ont été sautés, le site est parti sans ses téléchargements et
      # le .xpi fraîchement signé a été jeté avec le runner. Aucun run n'avait
      # échoué. « git status --porcelain », lui, voit le suivi ET le neuf.
      - name: Le paquet a-t-il changé ?
        id: paquet
        run: |
          if [ -z "$(git status --porcelain -- docs/download)" ]; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "Aucune re-signature : les téléchargements servis restent bons."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            echo "Extension re-signée : rebuild du site pour embarquer le paquet neuf."
          fi
      # LE SECOND BUILD NE SERT QU'À LA SIGNATURE, et à rien d'autre. Le seul pas
      # qui touche à docs/ entre les deux est celui du dessus : il réécrit
      # docs/download/ (le .xpi signé, updates.json, l'empreinte, les manifests),
      # et sans ce rebuild le site partirait avec les téléchargements d'avant.
      # Sur un push ordinaire, ce pas est sauté et rien ne bouge entre les deux
      # builds : mkdocs refabriquait alors site/ à l'identique, à chaque push, et
      # une étape qui ne peut rien changer finit par être crue là où elle compte.
      - name: Rebuild (téléchargements à jour)
        if: steps.paquet.outputs.change == 'true'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build
      # La re-signature modifie manifests, archives, updates.json et empreinte :
      # on les recommitte sur la branche ([skip ci] : pas de nouveau run).
      - name: Republier l'extension re-signée sur la branche
        if: steps.paquet.outputs.change == 'true'
        run: |
          # Même piège que plus haut : git diff ignore le NEUF, et tout ce que
          # la signature écrit dans docs/download/ est neuf tant que le dossier
          # n'est pas suivi. C'est git status qui décide ici.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "CI : extension re-signée automatiquement [skip ci]"
            # si la branche a avancé pendant le run : rebaser en préférant NOS
            # artefacts (les binaires fraîchement signés), sinon le rebase
            # échoue sur les archives et la version signée reste orpheline
            git push || (git pull --rebase -X theirs && git push)
          fi
      # Un seul site GitHub Pages (branche gh-pages), NEUF emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (le hub)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/
      #   owd      -> owd/       https://igneefleur.github.io/fns-ttrpg/owd/
      #   owd-beta -> owd-beta/  https://igneefleur.github.io/fns-ttrpg/owd-beta/
      #   mia      -> mia/       https://igneefleur.github.io/fns-ttrpg/mia/      (CE workflow)
      #   mia-beta -> mia-beta/  https://igneefleur.github.io/fns-ttrpg/mia-beta/
      #
      # LE DOSSIER mia/ NE SE RENOMMERA PAS, quoi qu'il arrive à la branche. Ce
      # chemin part dans le paquet SIGNÉ — adresse de la fiche et adresse des
      # mises à jour — et rien ne redirige : le changer après la première
      # signature coûterait une réinstallation manuelle à chaque joueur, plus une
      # signature Mozilla. La règle est écrite maintenant, avant qu'il y ait un
      # joueur, parce qu'après il sera trop tard : c'est exactement ce qui a figé
      # le dossier jjk/. Le nom de la BRANCHE, lui, est interne et se renomme sans
      # conséquence ; ne pas déduire de leur nom identique qu'ils sont liés.
      #
      # Avec target-folder, « clean » ne nettoie QUE le dossier cible : les huit
      # autres emplacements sont épargnés par ce déploiement.
      #
      # RAPPEL : le déploiement de main, seul à écrire à la RACINE, doit nommer
      # mia et mia-beta dans son clean-exclude, sans quoi le prochain push du hub
      # efface les deux sites MIA sans qu'aucun run n'échoue.
      - name: Déploiement MIA officiel (mia -> mia/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          target-folder: mia
          clean: true
          force: false
      # L'EXTENSION EST UNIQUE : ELLE SE PUBLIE AUX DEUX ADRESSES. Symétrique de
      # ce que fait le workflow de mia-beta, et pour la même raison : le paquet
      # porte les deux moitiés, la case du popup choisit, il n'y a donc pas une
      # extension par branche. Sans cela, l'adresse qui n'a pas déployé en
      # dernier sert un paquet périmé.
      #
      # MAIS SEULEMENT QUAND CE RUN A VRAIMENT SIGNÉ. Ce qui se propage d'une
      # adresse à l'autre, c'est une SIGNATURE, jamais un déploiement : les deux
      # branches ne portent pas forcément le même paquet, puisque la re-signature
      # automatique ne commite que sur celle-ci. Recopier à chaque push faisait de
      # « qui a déployé en dernier » l'arbitre du paquet servi, ce qui a déjà fait
      # reculer une adresse de plusieurs versions sans qu'aucun run n'échoue.
      - name: L'extension signée va aussi sur mia-beta (download/ seul)
        if: steps.paquet.outputs.change == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/download
          branch: gh-pages
          target-folder: mia-beta/download
          clean: false
          force: false
