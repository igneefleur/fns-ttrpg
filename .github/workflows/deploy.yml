name: website deployment
on:
  push:
    branches:
      - jjk-beta
  workflow_dispatch:
    inputs:
      signer:
        description: "Signer l'extension beta chez Mozilla (consomme le quota AMO)"
        type: boolean
        default: false
permissions:
  contents: write
# Les cinq branches écrivent sur la même branche gh-pages, chacune dans son
# dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances Python
        run: pip install mkdocs-material requests
      # LE FICHIER SERVI DOIT CORRESPONDRE À SES MORCEAUX, et c'est ici qu'on le
      # vérifie — avant de construire quoi que ce soit.
      #
      # Depuis le découpage, docs/javascripts/*.js et les deux moitiés de
      # l'extension sont ENGENDRÉS depuis src/ par scripts/assembler.py. Un
      # morceau modifié sans réassemblage passe « git status » sans un mot : le
      # dépôt paraît propre, le site déploie l'ancien code, et le correctif reste
      # invisible sans que rien n'échoue. C'est exactement le genre de panne qu'on
      # cherche pendant des heures.
      #
      # On VÉRIFIE sans écrire : la CI ne doit pas réparer en silence ce qui n'a
      # pas été fait, sinon le dépôt garde durablement des sources et des fichiers
      # servis qui divergent. Un écart arrête le déploiement et dit quel morceau
      # relire.
      - name: Assemblage à jour
        run: python scripts/assembler.py --verifie
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"   # coupe l'encadré promo « MkDocs 2.0 » de Material dans les logs
        run: mkdocs build
      # BRANCHE BETA : la signature Mozilla ne part JAMAIS toute seule.
      # Un push ne fait que déployer le site beta ; l'extension beta ne se
      # signe que sur relance manuelle du workflow, case « signer » cochée
      # (chaque soumission mord sur le quota AMO du compte).
      - name: Extension beta (signature manuelle seulement)
        if: ${{ inputs.signer }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python scripts/ci_extension.py
      # LE SECOND BUILD NE SERT QU'À LA SIGNATURE, et à rien d'autre. Le seul pas
      # qui touche à docs/ entre les deux est celui du dessus : il réécrit
      # docs/download/ (le .xpi signé, updates.json, l'empreinte, les manifests),
      # et sans ce rebuild le site partirait avec les téléchargements d'avant.
      # Sur un push ordinaire, ce pas est sauté et rien ne bouge entre les deux
      # builds : mkdocs refabriquait alors site/ à l'identique, à chaque push, et
      # une étape qui ne peut rien changer finit par être crue là où elle compte.
      - name: Rebuild (téléchargements à jour)
        if: ${{ inputs.signer }}
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build
      # La re-signature modifie manifests, archives, updates.json et empreinte :
      # on les recommitte sur la branche ([skip ci] : pas de nouveau run).
      - name: Republier l'extension re-signée sur la branche
        if: ${{ inputs.signer }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "CI : extension re-signée automatiquement [skip ci]"
            # si la branche a avancé pendant le run : rebaser en préférant NOS
            # artefacts (les binaires fraîchement signés), sinon le rebase
            # échoue sur les archives et la version signée reste orpheline
            git push || (git pull --rebase -X theirs && git push)
          fi
      # Un seul site GitHub Pages (branche gh-pages), CINQ emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (le hub)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/ (CE workflow)
      # Avec target-folder, « clean » ne nettoie QUE le dossier cible : les quatre
      # autres emplacements sont épargnés par ce déploiement.
      - name: Déploiement jjk-beta (jjk-beta -> jjk-beta/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          target-folder: jjk-beta
          clean: true
          force: false
      # L'extension est unique : son update_url Firefox pointe TOUJOURS sur
      # /jjk/download/updates.json, même quand la partie beta du site évolue.
      # Une signature faite sur jjk-beta doit donc atteindre le canal public.
      # On compare l'empreinte signée et la version AVANT de copier : un beta en
      # retard ne peut jamais faire reculer /jjk/download/ (régression déjà vue).
      - name: Comparer le paquet signé beta au canal public
        id: extension_publication
        run: python scripts/compare_signed_extension.py --site site/download
      - name: Publier l'extension signée plus récente sur jjk (download/ seul)
        if: steps.extension_publication.outputs.publish == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/download
          branch: gh-pages
          target-folder: jjk/download
          clean: false
          force: false
