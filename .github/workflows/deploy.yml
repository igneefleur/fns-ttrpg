name: website deployment
on:
  push:
    branches:
      - owd
  workflow_dispatch: {}   # relance manuelle
permissions:
  contents: write
# Les branches du dépôt écrivent toutes sur la même branche gh-pages, chacune dans
# son dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour le changelog (hooks/changelog.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pas de WeasyPrint ici : le PDF est désactivé tant qu'il n'y a pas de livre
      # (voir l'en-tête de mkdocs.ci.yml, qui dit quoi rétablir le jour venu).
      - name: Dépendances Python
        run: pip install mkdocs-material

      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"   # coupe l'encadré promo « MkDocs 2.0 » de Material dans les logs
        run: mkdocs build --config-file mkdocs.ci.yml

      # Un seul site GitHub Pages (branche gh-pages), SEPT emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (le hub)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/
      #   owd      -> owd/       https://igneefleur.github.io/fns-ttrpg/owd/      (CE workflow)
      #   owd-beta -> owd-beta/  https://igneefleur.github.io/fns-ttrpg/owd-beta/
      #
      # Avec target-folder, « clean » ne nettoie QUE le dossier cible : les six
      # autres emplacements sont épargnés par ce déploiement, sans avoir à les
      # énumérer. Seul le déploiement de main, qui écrit à la RACINE, doit tenir
      # une liste clean-exclude à jour — et elle doit nommer owd et owd-beta.
      - name: Déploiement Outward (owd -> owd/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          target-folder: owd
          clean: true
          force: false
