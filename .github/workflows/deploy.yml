name: website deployment
on:
  push:
    branches:
      - hxh-beta
  workflow_dispatch: {}   # relance manuelle
permissions:
  contents: write
# Les cinq branches écrivent sur la même branche gh-pages, chacune dans son
# dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour le changelog (hooks/changelog.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # version éprouvée avec weasyprint==62.3 (évite le bleeding-edge 3.14)

      # Bibliothèques natives requises par WeasyPrint (Pango >= 1.44 ; cairo et
      # gdk-pixbuf ne sont plus nécessaires depuis WeasyPrint 53). On installe
      # aussi EB Garamond (police du corps) pour un rendu déterministe.
      - name: Dépendances système WeasyPrint + polices
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            fonts-ebgaramond \
            fontconfig
          fc-cache -f

      # mkdocs-to-pdf 0.11.2 épingle weasyprint==62.3, qui plante (AssertionError:
      # assert root_box) à la pagination de certaines pages. On force donc une
      # version récente de weasyprint + pydyf, validée localement, qui corrige le
      # bug ; l'API utilisée par mkdocs-to-pdf reste compatible. brotli sert à
      # décoder les woff2 des Google Fonts (@import dans extra.css : Cinzel).
      - name: Dépendances Python
        run: |
          pip install mkdocs-material "mkdocs-to-pdf==0.11.2" brotli
          pip install -U "weasyprint==69.0" "pydyf==0.12.1"

      # Build avec la config CI (qui active le plugin PDF). La variable
      # ENABLE_PDF_EXPORT déclenche réellement la génération du PDF.
      - name: Build (PDF activé)
        env:
          ENABLE_PDF_EXPORT: "1"
          NO_MKDOCS_2_WARNING: "1"   # coupe l'encadré promo « MkDocs 2.0 » de Material dans les logs
        run: mkdocs build --config-file mkdocs.ci.yml

      # Un seul site GitHub Pages (branche gh-pages), CINQ emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (le hub)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/ (CE workflow)
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/
      #
      # Avec target-folder, « clean » ne nettoie QUE le dossier cible : les quatre
      # autres emplacements sont épargnés par ce déploiement, sans avoir à les
      # énumérer. Seul le déploiement de main, qui écrit à la RACINE, doit tenir
      # une liste clean-exclude à jour.
      - name: Déploiement HxH chantier (hxh-beta -> hxh-beta/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          target-folder: hxh-beta
          clean: true
          force: false
