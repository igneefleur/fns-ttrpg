name: website deployment
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # relance manuelle
permissions:
  contents: write
# Les sept branches écrivent sur la même branche gh-pages, chacune dans son
# dossier : un groupe de concurrence commun (partagé entre workflows du dépôt)
# sérialise leurs déploiements, et force: false fait rebaser l'action (avec
# réessais) au lieu de force-pusser, pour qu'un run ne puisse pas écraser le
# travail d'un autre.
#
# EN CONTREPARTIE, ON NE POUSSE PAS PLUSIEURS BRANCHES D'AFFILÉE. Le groupe ne
# garde qu'UN run en attente : le troisième qui arrive annule celui qui
# patientait, et la branche concernée n'est jamais déployée — « completed /
# cancelled », aucune erreur, rien à lire. Pousser une branche, attendre la fin
# de son run, pousser la suivante.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AUCUNE CONSTRUCTION ICI, ET C'EST VOULU. Le hub est un fichier statique
      # (hub/index.html) : ni mkdocs, ni Python, ni dépendance à installer. Cette
      # branche est la seule à écrire à la RACINE du site ; une chaîne qui
      # échouerait laisserait le site entier sans porte d'entrée, alors que les
      # deux jeux, eux, continueraient de se déployer dans leurs dossiers.

      # Un seul site GitHub Pages (branche gh-pages), SEPT emplacements :
      #   main     -> racine     https://igneefleur.github.io/fns-ttrpg/          (CE workflow)
      #   hxh      -> hxh/       https://igneefleur.github.io/fns-ttrpg/hxh/
      #   hxh-beta -> hxh-beta/  https://igneefleur.github.io/fns-ttrpg/hxh-beta/
      #   jjk      -> jjk/       https://igneefleur.github.io/fns-ttrpg/jjk/
      #   jjk-beta -> jjk-beta/  https://igneefleur.github.io/fns-ttrpg/jjk-beta/
      #   owd      -> owd/       https://igneefleur.github.io/fns-ttrpg/owd/
      #   owd-beta -> owd-beta/  https://igneefleur.github.io/fns-ttrpg/owd-beta/
      #
      # LA LISTE clean-exclude DOIT PORTER TOUS LES AUTRES DOSSIERS, SANS
      # EXCEPTION. Seul ce déploiement écrit à la racine, donc seul son nettoyage
      # voit les dossiers des autres branches : ce qui n'est pas nommé ici est
      # effacé du site, sans que rien n'échoue et sans qu'aucune branche n'ait
      # bougé. jjk-beta y a déjà manqué, et le site beta JJK a disparu ;
      # la panne est illisible tant qu'on cherche du côté du contenu. Une branche
      # de plus = une ligne de plus ici, le même jour.
      - name: Déploiement du hub (main -> racine)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: hub
          branch: gh-pages
          clean: true
          force: false
          clean-exclude: |
            hxh
            hxh-beta
            jjk
            jjk-beta
            owd
            owd-beta
