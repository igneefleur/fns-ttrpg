name: relance jjk (signatures reportées)
# Relance quotidienne du déploiement de la branche jjk. Raison d'être : quand
# le quota journalier de signatures Mozilla (AMO) est épuisé, le workflow jjk
# déploie le site mais REPORTE la signature de l'extension. Ce déclencheur la
# rattrape automatiquement le lendemain, quand la fenêtre est retombée — un
# contenu déjà signé rend le run quasi gratuit (« rien à faire »).
# (Les crons ne s'exécutent que depuis la branche par défaut, d'où ce fichier
# sur main alors qu'il pilote jjk.)
on:
  schedule:
    - cron: "45 11 * * *"   # 11 h 45 UTC : après la retombée du quota AMO de la veille
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  relance:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le workflow de la branche jjk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref jjk --repo ${{ github.repository }}
