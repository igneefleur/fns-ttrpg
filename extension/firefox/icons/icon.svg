<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Icône « Fiche Outward » : la boussole du voyageur — cadran de parchemin
       et aiguille, sur une tuile vert sombre. Outward est un jeu de survie et
       de voyage ; la boussole est le seul de ses objets qui se dessine encore
       à seize pixels.
       Aucun texte, aucun dégradé, aucun filtre, aucune police : un sigle de
       trois lettres tiendrait à 96 px et deviendrait une tache à 16.
       Pas de width ni de height sur le <svg>, seulement le viewBox : l'icône
       se met à l'échelle de la case que le navigateur lui donne (16, 32, 48,
       96…). Les couleurs sont celles du site Outward — parchemin #faf6eb,
       olive #46543b, et l'or #c9a24e de la palette de nuit pour la pointe
       sud, qui doit se distinguer de la nord sans ajouter une troisième
       famille de tons. Le fond est sombre pour que la tuile tienne sur les
       barres d'outils claires COMME sur les sombres. -->
  <rect width="96" height="96" rx="18" fill="#232c1e"/>
  <circle cx="48" cy="48" r="32" fill="#faf6eb" stroke="#46543b" stroke-width="3"/>
  <polygon points="48,20 57,48 39,48" fill="#46543b"/>
  <polygon points="48,76 39,48 57,48" fill="#c9a24e"/>
  <circle cx="48" cy="48" r="4" fill="#232c1e"/>
</svg>
